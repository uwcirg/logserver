name: Python Tests

# 1. Run on every push
on:
  push: {}

jobs:
  test:
    # 2. Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # 3. Spin up a PostgreSQL service for tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 4. Check out code
      - uses: actions/checkout@v3

      # 5. Create test database & apply schema
      - name: Initialize database
        env:
          PGPASSWORD: postgres
          PGHOST:   localhost
          PGUSER:   postgres
        run: |
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS test_db;"
          psql -h localhost -U postgres -c "CREATE DATABASE test_db;"
          psql -h localhost -U postgres -d test_db -f sql/01_create-tables.sql
          psql -h localhost -U postgres -d test_db -f sql/03_create-view.sql

      # 6. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 7. Load the integration dump so tests/test_integration_logs.py has data
      - name: Load integration dataset
        run: |
          psql -h localhost -U postgres -d test_db < datasets/logs.sql
    
      # 8. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg2-binary python-dotenv

      # 9. Run pytest
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          pytest --maxfail=1 --disable-warnings -v
